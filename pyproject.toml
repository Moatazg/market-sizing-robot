[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market_robot"
version = "0.1.0"
description = "Config-driven TAM/SAM/SOM calculator with loaders, pricebook ARPU, inflation alignment, and reporting"
authors = [{name="Your Name", email="you@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyyaml", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
market-repl = "market_robot.repl:main"
